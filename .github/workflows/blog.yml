name: Research blog

on:
  push:
    branches: [master, main]
    paths: ['blog/**', '.github/workflows/blog.yml']
  pull_request:
    paths: ['blog/**', '.github/workflows/blog.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: blog
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5
      - name: Write deployment configuration
        working-directory: blog
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          ruby -rjson -e 'File.write("_deploy.yml", {"url" => ENV.fetch("SITE_ORIGIN"), "baseurl" => ENV.fetch("SITE_BASE_PATH"), "repository_url" => ENV.fetch("REPOSITORY_URL")}.to_json)'
      - name: Build
        working-directory: blog
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter --config _config.yml,_deploy.yml
      - name: Check generated links
        working-directory: blog
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bundle exec ruby scripts/check.rb _site "$SITE_BASE_PATH"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: blog/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
