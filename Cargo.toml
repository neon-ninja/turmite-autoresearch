[package]
name = "turmite"
version = "0.1.0"
edition = "2024"

[features]
# GPU sweep (src/gpu, src/bin/gpu_sweep.rs). Needs no CUDA toolkit to build; at run time it needs
# libcuda (driver) and libnvrtc.so.12 on LD_LIBRARY_PATH.
cuda = ["dep:cudarc"]

[dependencies]
rayon = "1.12.0"
# Only with --features cuda. dynamic-loading: dlopen the driver and NVRTC, no link-time dependency.
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12090"] }

[dev-dependencies]
proptest = "1.11.0"

[[bin]]
name = "gpu_sweep"
path = "src/bin/gpu_sweep.rs"
required-features = ["cuda"]

[[bin]]
name = "gpu_probe"
path = "src/bin/gpu_probe.rs"
required-features = ["cuda"]
