[project]
name = "turmite-analysis"
version = "0.1.0"
description = "Analysis and rendering scripts for the turmite study"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "polars",
    "matplotlib",
    "pillow",
    "diptest>=0.11.0",
    "scikit-learn>=1.9.1",
    "ipykernel>=7.4.0",
    "nbformat>=5.11.1",
    "nbclient>=0.11.0",
]

[tool.uv]
package = false

[dependency-groups]
blog = [
    "beautifulsoup4>=4.15.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
]
